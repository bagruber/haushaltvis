# ─────────────────────────────────────────────────────────────────────────────
# Kurze Einleitungstexte für die explorative (kamerale) Sicht.
#
# Schlüssel:
#   "ep:<N>"   Einzelplan (0–9)
#   "ab:<NN>"  Bereich (2-stelliger Abschnitt) — optional, für Detailtexte
#
# Frei editierbar. Nach Änderung: python etl/build_web.py
# ─────────────────────────────────────────────────────────────────────────────

"ep:0": >
  Der innere Betrieb der Stadt: Bürgermeister und Stadtrat, Geschäftsleitung,
  Kämmerei, Standesamt, EDV und die Verwaltungsgebäude.

"ep:1": >
  Ordnungsamt, Melde- und Zulassungswesen, Verkehrsüberwachung, die Feuerwehren
  Moosburg, Pfrombach/Aich und Thonstetten sowie der Katastrophenschutz.

"ep:2": >
  Sachkosten der städtischen Schulen samt Gebäuden und Ausstattung sowie die
  Schülerbeförderung. Die Lehrkräfte bezahlt der Freistaat.

"ep:3": >
  Museen, Heimat- und Kulturpflege, Festspiele und Märkte, Volkshochschule,
  Stadtbücherei, kirchliche Angelegenheiten und Städtepartnerschaften.

"ep:4": >
  Vor allem Kindertageseinrichtungen und Jugendarbeit, in städtischer, kirchlicher
  und freier Trägerschaft. Dazu Obdachlosenhilfe und weitere soziale Aufgaben.

"ep:5": >
  Frei- und Hallenbad, Sportanlagen und Sportförderung, Park- und Grünanlagen,
  Naturschutz und Friedhöfe.

"ep:6": >
  Bauverwaltung und Städtebau, Gemeindestraßen und Brücken, Straßenbeleuchtung und
  -reinigung, Parkeinrichtungen, Gewässer und der Bauhof.

"ep:7": >
  Abwasser mit Kanal und Kläranlage, Abfall und Wertstoffhof, öffentliche
  Einrichtungen wie die Stadthalle, Wirtschaftsförderung und Öffentlichkeitsarbeit.

"ep:8": >
  Die städtischen Versorgungsbetriebe (Strom, Wasser), der Stadtwald und der
  Grundbesitz der Stadt, einschließlich Gewerbe- und Wohngebieten.

"ep:9": >
  Die großen Geldströme ohne eigene Einrichtung: Steuern, Schlüsselzuweisungen und
  Umlagen, Kredite und Schuldendienst, Zuführungen und Rücklagen.
