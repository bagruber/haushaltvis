# ─────────────────────────────────────────────────────────────────────────────
# Kontextdaten für relative Betrachtungen in den Timelines.
#
# population: Einwohnerzahl der Stadt Moosburg a.d. Isar je Haushaltsjahr.
#   Quelle: GENESIS-Online (amtlicher Bevölkerungsstand, öffentlich). Stichtag ist
#   jeweils der 31.12.; ein Haushaltsjahr nutzt den Stand vom 31.12. des Vorjahres,
#   damit auch das laufende Jahr einen Wert hat (2026 = Stand 31.12.2025).
# cpi: Verbraucherpreisindex Deutschland, Jahresdurchschnitt, Basis 2020 = 100
#   (Statistisches Bundesamt). 2025/2026 aus den amtlichen Inflationsraten
#   fortgeschrieben (2025: +2,2 %; 2026: Prognose ~+2 %).
# ─────────────────────────────────────────────────────────────────────────────

population:
  2016: 17847   # Stand 31.12.2015
  2017: 18181   # Stand 31.12.2016
  2018: 18487   # Stand 31.12.2017
  2019: 18510   # Stand 31.12.2018
  2020: 18656   # Stand 31.12.2019
  2021: 18893   # Stand 31.12.2020
  2022: 19309   # Stand 31.12.2021
  2023: 18681   # Stand 31.12.2022
  2024: 19882   # Stand 31.12.2023
  2025: 20012   # Stand 31.12.2024
  2026: 20107   # Stand 31.12.2025
  2027: 20107   # noch kein Stand 31.12.2026: vorerst der Wert von 2026

cpi:
  2016: 94.9
  2017: 96.3
  2018: 98.0
  2019: 99.4
  2020: 100.0
  2021: 103.2
  2022: 110.3
  2023: 116.7
  2024: 119.3
  2025: 121.9
  2026: 124.3   # Prognose

# vpi_monat: Verbraucherpreisindex Deutschland je Monat, Basis 2020 = 100
#   (Statistisches Bundesamt, Tabelle 61111-0002, abgerufen 17.11.2026).
#   Für die Veränderung von Ansatz zu Ansatz in der Gesamtliste: ein Ansatz
#   gilt ab Jahresbeginn, also zählt der Stand zum 1.1., der Dezemberwert des
#   Vorjahres. Fehlt der noch, nimmt die App den jüngsten Monat davor.
vpi_monat:
  "2021-12": 104.7
  "2022-12": 113.2
  "2023-12": 117.4
  "2024-12": 120.5
  "2025-12": 122.7
  "2026-10": 126.5
