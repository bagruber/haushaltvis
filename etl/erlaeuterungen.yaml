# Gesichtete Erläuterungen der Kämmerei aus dem Arbeitsplan (etl/erlaeuterungen.py).
#
# Je Haushaltsstelle die Entscheidung über ihren Erläuterungstext:
#   zeigen: true    wörtlich auf der Seite der Haushaltsstelle und in den Listen
#   zeigen: kurz    nur der kurze Text
#   zeigen: false   nicht gezeigt
#   text            gezeigt statt des wörtlichen Textes: derselbe Text, nur ohne Namen
#   suchwoerter     findet die Stelle in der Suche, auch wenn der Text nicht steht
#   pruef           Prüfwert des Textes, wie er bei der Sichtung im Arbeitsplan stand
#
# Die Texte selbst stehen nicht hier, nur unter `text` ein gezeigter Text ohne
# Namen: Das Repository ist öffentlich, und was nicht gezeigt wird, soll auch
# hier nicht stehen. Texte und Gründe der
# Sichtung liegen lokal neben dem Arbeitsplan (haushaltsplaene/arbeitsplan/
# erlaeuterungen-sichtung.yaml, nicht im Repo).
#
# Gezeigt wird, was ohne Vorwissen richtig verstanden wird. Nicht gezeigt:
# interne Vermerke (Haushaltsreste, Verweise auf andere Haushaltsstellen,
# Fragen, Hinweise unter Kollegen), Kürzel, die den Sinn tragen, Rechenformeln
# in Kürzeln, Angaben zu Personen oder bestimmbaren Mietern, Planungen, die als
# Beschluss gelesen werden könnten. Ein Kürzel als ein Posten einer sonst
# klaren Liste hindert nicht.
#
# Namen von Firmen, Personen und Fachsoftware stehen in keinem gezeigten Text.
# Wo der Text ohne sie trägt, steht an ihrer Stelle in eckigen Klammern, was
# sie sind („[Bibliothekssoftware]“), sonst wird er nicht gezeigt. Allgemein
# bekannte Namen wie iPad oder Windows Server bleiben.
#
# Ändert die Kämmerei einen Text, passt der Prüfwert nicht mehr, und das Skript
# lässt die Stelle weg, bis sie neu gesichtet ist.

