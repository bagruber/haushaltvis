# ─────────────────────────────────────────────────────────────────────────────
# Glossar — Fachbegriffe der Kameralistik & kommunaler Haushalte.
# Jeder Eintrag: title (Anzeige) + text (Kurzerklärung, auch als Tooltip).
# Schlüssel = kebab-case-id, im Code via <Term name="…"> referenziert und als
# Anker auf der Glossar-Seite (/glossar#id). Nach Änderung: python etl/build_web.py
# ─────────────────────────────────────────────────────────────────────────────

ansatz:
  title: "Ansatz"
  text: >
    Der für ein Jahr geplante Betrag (das „Soll"), vor Jahresbeginn im
    Haushaltsplan beschlossen.
ergebnis:
  title: "Ergebnis (Ist)"
  text: >
    Der tatsächlich verbuchte Betrag eines Jahres (das „Ist"). Steht erst mit dem
    Jahresabschluss fest.
verwaltungshaushalt:
  title: "Verwaltungshaushalt"
  text: >
    Das laufende Tagesgeschäft der Stadt: Personal, Betrieb, Zuschüsse. Finanziert
    aus laufenden Einnahmen wie Steuern und Gebühren.
vermoegenshaushalt:
  title: "Vermögenshaushalt"
  text: >
    Die Investitionen, also Bau, Grundstücke und Anschaffungen. Finanziert aus
    Förderungen, Verkäufen, Rücklagen und Krediten; schwankt stark von Jahr zu Jahr.
investition:
  title: "Investition"
  text: >
    Geld für etwas, das viele Jahre genutzt wird, etwa ein Schulhaus, eine Straße
    oder ein Fahrzeug. Steht im Vermögenshaushalt.
einzelplan:
  title: "Einzelplan"
  text: >
    Oberste Gliederungsebene des Haushalts (0 bis 9) nach Aufgabenbereich, z. B.
    „2 Schulen" oder „6 Bau und Verkehr".
abschnitt:
  title: "Abschnitt"
  text: >
    Zweite Gliederungsebene innerhalb eines Einzelplans (zweistellig), z. B.
    „21 Grundschulen".
unterabschnitt:
  title: "Unterabschnitt"
  text: >
    Feinere Gliederungsebene. Hier steht der Begriff für die benannte Einrichtung,
    z. B. „Freibad" oder „Stadtbücherei".
gliederung:
  title: "Gliederung (GLZ)"
  text: >
    Die Nummer, die angibt, wofür Geld fließt (Aufgabe oder Einrichtung). Mit der
    Gruppierung ergibt sie die Haushaltsstelle.
gruppierung:
  title: "Gruppierung (GRZ)"
  text: >
    Die Nummer für die Art der Einnahme oder Ausgabe, z. B. Personalausgaben,
    Sachkosten, Steuereinnahmen.
haushaltsstelle:
  title: "Haushaltsstelle"
  text: >
    Der einzelne Buchungsposten aus Gliederung und Gruppierung, z. B. die
    Beamtenbezüge einer bestimmten Schule.
hauptgruppe:
  title: "Hauptgruppe"
  text: >
    Die erste Ziffer der Gruppierung. Sie zeigt, ob es eine Einnahme oder Ausgabe
    ist und zu welchem der beiden Haushalte sie gehört.
schluesselzuweisung:
  title: "Schlüsselzuweisung"
  text: >
    Allgemeine Zuweisung des Freistaats an finanzschwächere Gemeinden im
    kommunalen Finanzausgleich.
finanzausgleich:
  title: "Kommunaler Finanzausgleich"
  text: >
    Das Ausgleichssystem zwischen Land und Kommunen, u. a. über
    Schlüsselzuweisungen und Umlagen.
kreisumlage:
  title: "Kreisumlage"
  text: >
    Abgabe der Stadt an den Landkreis für dessen Aufgaben. Eine der größten
    Ausgaben im Verwaltungshaushalt.
gewerbesteuerumlage:
  title: "Gewerbesteuerumlage"
  text: >
    Der Teil der Gewerbesteuer, den die Stadt an Land und Bund abführt.
zufuehrung:
  title: "Zuführung"
  text: >
    Übertrag vom Verwaltungs- an den Vermögenshaushalt: Überschüsse aus dem
    laufenden Betrieb finanzieren Investitionen.
ruecklage:
  title: "Rücklage"
  text: >
    Angesparte Mittel der Stadt. Eine Entnahme finanziert Investitionen, eine
    Zuführung spart an.
schuldendienst:
  title: "Schuldendienst"
  text: >
    Zinsen und Tilgung für aufgenommene Kredite.
zuschuss-aus-allg-haushalt:
  title: "Eigenanteil der Stadt"
  text: >
    Was ein Bereich mehr ausgibt, als er selbst einnimmt. Die Stadt trägt es aus
    allgemeinen Mitteln, vor allem Steuern. Fachbegriff: Zuschussbedarf.
interne-verrechnung:
  title: "Interne Verrechnung"
  text: >
    Buchung zwischen städtischen Stellen (z. B. Leistungen des Bauhofs) oder
    zwischen den beiden Haushalten. In Übersichten ausgeblendet, sonst zählte sie
    doppelt.
freiwillige-leistung:
  title: "Freiwillige Leistung"
  text: >
    Eine Ausgabe ohne gesetzliche Pflicht, z. B. Kultur- oder Sportförderung.
    Gegenteil der Pflichtaufgabe.
pflichtaufgabe:
  title: "Pflichtaufgabe"
  text: >
    Eine Aufgabe, die die Stadt von Gesetzes wegen erfüllen muss (z. B. Schulen,
    Feuerwehr, Kinderbetreuung).
kameralistik:
  title: "Kameralistik"
  text: >
    Das an Einnahmen und Ausgaben orientierte Rechnungssystem bayerischer Kommunen,
    nach dem dieser Haushalt aufgebaut ist.
doppik:
  title: "Doppik"
  text: >
    Die kaufmännische doppelte Buchführung, die in vielen Kommunen die
    Kameralistik ablöst.
haushaltsausgleich:
  title: "Haushaltsausgleich"
  text: >
    Der Grundsatz, dass Einnahmen und Ausgaben je Haushalt gleich hoch sind. Der
    Haushalt geht also immer auf.
