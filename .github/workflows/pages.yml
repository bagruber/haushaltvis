name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Die Formsprache-Probe laeuft als Vorschau unter /haushaltvis/v2/, gebaut
      # vom Branch probe/formsprache. Die Wurzel bleibt der Stand von main.
      # Gebaut wird hier und nicht im Branch, weil die Umgebung github-pages nur
      # Deploys von main zulaesst; der Branch stoesst diesen Workflow nur an.
      - name: Branch probe/formsprache holen
        id: probe
        run: |
          if git ls-remote --exit-code --heads origin probe/formsprache; then
            git fetch --depth 1 origin probe/formsprache
            git worktree add "$RUNNER_TEMP/probe" FETCH_HEAD
            echo "da=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Abhaengigkeiten der Probe
        id: probedeps
        if: steps.probe.outputs.da == 'true'
        working-directory: ${{ runner.temp }}/probe
        run: |
          pnpm install --frozen-lockfile
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Die Vorschaukarten werden in einem lokalen Chromium gerendert
      # (scripts/karten.mjs). Rund 150 MB, deshalb ueber die Playwright-Version
      # gecacht statt in jedem Lauf neu geladen.
      - name: Chromium aus dem Cache
        if: steps.probe.outputs.da == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.probedeps.outputs.playwright }}

      - name: Chromium bereitstellen
        if: steps.probe.outputs.da == 'true'
        working-directory: ${{ runner.temp }}/probe
        run: |
          if [ -f scripts/karten.mjs ]; then
            pnpm exec playwright-core install --with-deps chromium
          else
            echo "Der Branch kennt scripts/karten.mjs noch nicht — kein Chromium noetig."
          fi

      # Nicht `pnpm run build`: der Branch haengt an sein build-Skript das
      # Kartenskript an, und die Argumente landeten dann dort statt bei vite.
      # Darum die Schritte einzeln.
      - name: Probe nach dist/v2 bauen
        if: steps.probe.outputs.da == 'true'
        working-directory: ${{ runner.temp }}/probe
        env:
          SITE_URL: https://bagruber.github.io
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base /haushaltvis/v2/ --outDir "$GITHUB_WORKSPACE/dist/v2" --emptyOutDir
          if [ -f scripts/karten.mjs ]; then
            node scripts/karten.mjs "$GITHUB_WORKSPACE/dist/v2"
          fi

      - name: Sanity-check dist/
        run: |
          echo "── dist root ─────────────────────"
          ls -la dist
          echo "── dist/data ────────────────────"
          ls -la dist/data
          if [ -d dist/v2/karten ]; then
            echo "── Vorschaukarten der Probe ─────"
            echo "$(find dist/v2/karten -name '*.png' | wc -l) Bilder, $(find dist/v2 -name 'index.html' | wc -l) HTML-Dateien"
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
