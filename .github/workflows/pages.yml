name: Deploy to GitHub Pages

# Die Ratsversion: alle Daten, auch Entwurf, Zwischenstände und Erläuterungen.
# Die Bürgerversion für moosburg.eu baut moosburg-eu.yml aus demselben Stand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - id: deps
        run: |
          pnpm install --frozen-lockfile
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Die Vorschaukarten werden in einem lokalen Chromium gerendert
      # (scripts/karten.mjs, Teil von `pnpm run build`). Rund 150 MB, deshalb
      # ueber die Playwright-Version gecacht statt in jedem Lauf neu geladen.
      - name: Chromium aus dem Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.deps.outputs.playwright }}
      - name: Chromium bereitstellen
        run: pnpm exec playwright-core install --with-deps chromium

      - run: pnpm run build
        env:
          SITE_URL: https://bagruber.github.io

      - name: Sanity-check dist/
        run: |
          echo "── dist root ─────────────────────"
          ls -la dist
          echo "── dist/data ────────────────────"
          ls -la dist/data
          echo "$(find dist/karten -name '*.png' | wc -l) Kartenbilder, $(find dist -name 'index.html' | wc -l) HTML-Dateien"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
