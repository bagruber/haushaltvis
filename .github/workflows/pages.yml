name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Die Formsprache-Probe laeuft als Vorschau unter /haushaltvis/v2/, gebaut
      # vom Branch probe/formsprache. Die Wurzel bleibt der Stand von main.
      # Gebaut wird hier und nicht im Branch, weil die Umgebung github-pages nur
      # Deploys von main zulaesst; der Branch stoesst diesen Workflow nur an.
      - name: Branch probe/formsprache holen
        id: probe
        run: |
          if git ls-remote --exit-code --heads origin probe/formsprache; then
            git fetch --depth 1 origin probe/formsprache
            git worktree add "$RUNNER_TEMP/probe" FETCH_HEAD
            echo "da=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe nach dist/v2 bauen
        if: steps.probe.outputs.da == 'true'
        working-directory: ${{ runner.temp }}/probe
        run: |
          pnpm install --frozen-lockfile
          pnpm run build --base /haushaltvis/v2/ --outDir "$GITHUB_WORKSPACE/dist/v2" --emptyOutDir

      - name: Sanity-check dist/
        run: |
          echo "── dist root ─────────────────────"
          ls -la dist
          echo "── dist/data ────────────────────"
          ls -la dist/data

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
