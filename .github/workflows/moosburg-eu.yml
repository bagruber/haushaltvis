name: Deploy auf moosburg.eu/haushalt/

# Die Bürgerversion: nur Beschlossenes, ohne Entwurf, Zwischenstände, den
# Wortlaut der Erläuterungen und die Gesamtliste (src/lib/variante.ts,
# scripts/buerger.mjs). Gebaut aus demselben Stand wie die Ratsversion auf
# GitHub Pages (pages.yml).
#
# Bis zur Freigabe nur von Hand: Actions → „Deploy auf moosburg.eu/haushalt/“
# → Run workflow. Die Seite ist auf moosburg.eu nirgends verlinkt und trägt
# noindex (index.html).
on:
  workflow_dispatch:

concurrency:
  group: deploy-haushalt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - id: deps
        run: |
          pnpm install --frozen-lockfile
          echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chromium aus dem Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.deps.outputs.playwright }}
      - name: Chromium bereitstellen
        run: pnpm exec playwright-core install --with-deps chromium

      # Schneiden vor den Karten, damit auch die Karten nur das Beschlossene
      # kennen; danach noch einmal prüfen, über alles, was hochgeht.
      - run: pnpm test
      - name: Bürgerversion bauen und prüfen
        env:
          VITE_VARIANTE: buerger
          SITE_URL: https://moosburg.eu
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base /haushalt/ --outDir dist-buerger --emptyOutDir
          node scripts/buerger.mjs dist-buerger
          node scripts/karten.mjs dist-buerger
          node scripts/buerger.mjs dist-buerger --pruefen

      # Die App nutzt echte Pfade. Adressen mit eigener Vorschaukarte sind
      # Ordner mit index.html, die liefert der Server selbst; alle übrigen
      # ohne Dateiendung gehen an die App. Mit Endung nicht: eine fehlende
      # .json soll 404 sein, nicht die App-Schale mit 200.
      # Eine eigene RewriteEngine schaltet die Regeln der Domain für diesen
      # Ordner ab. Deren Sperre für Pfade mit führendem Punkt (etwa eine
      # mitgebaute .env) steht deshalb hier noch einmal.
      - name: SPA-Fallback für Apache
        run: |
          cat > dist-buerger/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /haushalt/
          RewriteRule (^|/)\.(?!well-known/) - [F,L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{2,5}$
          RewriteRule . /haushalt/index.html [L]
          HTACCESS

      # Eigenes FTP-Konto, in hPanel auf den Ordner haushalt beschränkt: Das
      # Login beginnt dort, deshalb unten server-dir ./. Gehören die Secrets zu
      # einem anderen Konto oder liegt das Login in der Domain-Wurzel, bricht
      # der Deploy hier ab, bevor etwas übertragen wird (moosburg-eu/BRIEFING.md).
      - name: Ziel prüfen
        env:
          KONTO: haushalt
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          case "$FTP_USER" in
            *"$KONTO") ;;
            *) echo "FTP_USER ist nicht das Konto $KONTO. Abbruch."; exit 1 ;;
          esac
          liste=$(curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" --list-only "ftp://$FTP_HOST/" | tr -d '\r')
          if grep -qx stadtrat <<< "$liste" && grep -qx abstimmung <<< "$liste"; then
            echo "Das Login liegt in der Domain-Wurzel. Abbruch."; exit 1
          fi

      # lftp statt der FTP-Deploy-Action: Die Action legt jeden Ordner einzeln
      # und nacheinander an, gut 0,8 s pro Ordner. Bei rund 4.700 Ordnern, einer
      # Vorschaukarte je Haushaltsstelle, riss sie die Stunde, nach der Hostinger
      # eine Verbindung trennt (23.11.2026), und weil sie ihren Stand erst am Ende
      # speichert, begann jeder neue Versuch von vorn. lftp arbeitet mit mehreren
      # Verbindungen gleichzeitig.
      #
      # --transfer-all lädt jedes Mal alles hoch: Größe und Zeitstempel taugen
      # nicht zum Vergleich, eine geänderte Zahl gleicher Länge sähe sonst
      # unverändert aus. --delete entfernt, was der Build nicht mehr enthält;
      # das Konto reicht nur bis haushalt/, und „Ziel prüfen“ steht davor.
      - name: Nach haushalt/ spiegeln
        timeout-minutes: 50
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          lftp --version | head -1
          # Zertifikat und Hostname werden geprüft; FTP_HOST ist deshalb
          # srv1973.hstgr.io, das Zertifikat lautet auf *.hstgr.io.
          cat > spiegeln.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 60
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set mirror:parallel-directories true
          open --env-password -u "$FTP_USER" "ftp://$FTP_HOST"
          mirror --reverse --delete --transfer-all --parallel=6 --no-perms --verbose=1 dist-buerger/ ./
          EOF
          start=$(date +%s)
          if ! lftp -f spiegeln.lftp > spiegeln.log 2>&1; then
            tail -40 spiegeln.log; exit 1
          fi
          echo "Dauer: $(( $(date +%s) - start )) s"
          echo "Ordner angelegt: $(grep -c '^Making directory' spiegeln.log || true)"
          echo "Dateien übertragen: $(grep -c '^Transferring file' spiegeln.log || true)"
          echo "Entfernt: $(grep -c '^Removing' spiegeln.log || true)"
          tail -5 spiegeln.log
