         soll nicht gefunden werden; die Buergerversion erst nach der Freigabe. -->
    <meta name="robots" content="noindex" />
    <title>Haushalt Moosburg - Wohin fließt das Geld?</title>

    <meta property="og:type" content="website" />

      property="og:description"

    <meta property="og:url" content="https://bagruber.github.io/haushaltvis/" />
    <meta property="og:locale" content="de_DE" />

         mit eigener Karte ab; diese hier gilt, wo es keine gibt. -->

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Gegenstueck zu 404.html auf GitHub Pages. Als eigene Datei, nicht inline:
         moosburg.eu erlaubt Skripte nur aus Dateien (CSP script-src 'self'). -->
    <script src="%BASE_URL%weiterleitung.js"></script>
